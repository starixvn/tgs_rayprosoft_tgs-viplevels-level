apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "viplevels-level.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "viplevels-level.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Warning",
          "Tgs.VipLevels.Level.Messages.DepositFormMessageHandler": "Warning",
          "Tgs.VipLevels.Level.Messages.GameBetMessageHandler": "Warning",
          "Tgs.VipLevels.Level.Core.ApplicationServices.LevelUpgradeCommandService": "Warning"
        }
      },
      "VipLevelsLevelConnectionStrings": {
        "VipLevelServiceClientBaseUrl": "http://tgs-viplevel/",
        "PaymentServiceClientBaseUrl": "http://payment-api/"
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]